---
zfs_module_parameters:
  l2arc_headroom: 12
  l2arc_write_max: 1000000000
  l2arc_noprefetch: 0
  # Commented until tuning for spinning disks
  # zfs_vdev_async_read_max_active: 100
  # zfs_vdev_async_write_max_active: 100
  # zfs_vdev_sync_read_max_active: 100
  # zfs_vdev_sync_write_max_active: 100
  # zfs_vdev_max_active: 6000

zpool_data_options: >
  -f -o ashift=12
  -O relatime=on
  -O logbias=throughput
  -O xattr=off
  -O compression=lz4

zpool_data_devices: |-
  {% if 'scsi-0QEMU_QEMU_HARDDISK_data' in (ansible_facts['device_links']['ids'].values() | flatten) -%}
  /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_data
  {% elif 'google-data' in (ansible_facts['device_links']['ids'].values() | flatten) -%}
  /dev/disk/by-id/google-data
  {% else -%}
  /dev/disk/by-partlabel/data
  {%- endif %}

zpool_data: >
  {{ zpool_data_raid_level | default('') }}
  {{ zpool_data_options }}
  {{ zpool_data_devices }}

# Example zpools definition with default data disk:
# zpools:
#   data: "{{ zpool_data }}"
