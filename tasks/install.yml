---
- name: Remove kmod-zfs package
  ansible.builtin.dnf:
    name: kmod-zfs
    state: absent

- name: Install zfs-release package
  ansible.builtin.dnf:
    name: "https://zfsonlinux.org/epel/zfs-release-3-0.el{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    disable_gpg_check: true
    state: present

- name: Switch to zfs repository
  ansible.builtin.shell: |
    dnf config-manager --disable zfs-kmod
    dnf config-manager --enable zfs
  changed_when: false

- name: Install kernel-devel matching the running kernel
  ansible.builtin.dnf:
    name: "kernel-devel-{{ ansible_facts['kernel'] }}"
    state: present

- name: Install zfs package
  ansible.builtin.dnf:
    name: zfs
    state: present

- name: Load zfs kernel module
  community.general.modprobe:
    name: zfs
    state: present

- name: Ensure zfs module loads on boot
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/zfs.conf
    line: zfs
    create: true
    mode: "0644"

- name: Create zfs-tuning.sh
  ansible.builtin.template:
    src: zfs-tuning.sh.j2
    dest: /usr/local/sbin/zfs-tuning.sh
    owner: root
    group: root
    mode: "0755"

- name: Install zfs-tuning service
  ansible.builtin.copy:
    src: zfs-tuning.service
    dest: /usr/lib/systemd/system/zfs-tuning.service
    owner: root
    group: root
    mode: "0644"

- name: Start zfs-tuning service
  ansible.builtin.service:
    name: zfs-tuning
    state: started
    enabled: true
